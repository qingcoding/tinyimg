[package]
name = "tinyimg"
version = "0.1.0"
edition = "2021"
description = "图小小 TinyImg — 轻量本地图片压缩工具（TinyPNG 核心算法的 Rust CLI 实现）"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
color_quant = "1.1"
indicatif = "0.17"
jpeg-encoder = "0.6"
png = "0.17"
rayon = "1"
walkdir = "2"
zopfli = "0.6"
zune-core = "0.4"
zune-jpeg = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
