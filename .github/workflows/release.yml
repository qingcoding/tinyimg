name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            config: tauri.conf.json
            label: macOS (Apple Silicon)
          - os: macos-13
            target: x86_64-apple-darwin
            config: tauri.conf.json
            label: macOS (Intel)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            config: tauri.windows.conf.json
            label: Windows (x64)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # NSIS 用于生成 Windows .exe 安装器；choco 安装后需手动把目录写进 GITHUB_PATH
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build bundle
        working-directory: src-tauri
        run: tauri build --target ${{ matrix.target }} --config ${{ matrix.config }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg   artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe  artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi   artifacts/ 2>/dev/null || true
          echo "--- artifacts ---"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinyimg-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TinyImg ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: dist-artifacts/*
          body: |
            ## 下载

            | 平台 | 文件 |
            |---|---|
            | macOS（Apple Silicon, M 系列） | `TinyImg_*_aarch64.dmg` |
            | macOS（Intel） | `TinyImg_*_x64.dmg` |
            | Windows（64 位） | `TinyImg_*_x64-setup.exe`（NSIS 安装器） |

            ## 说明

            - 全程本地处理，图片不上传任何服务器。
            - macOS：打开 dmg 后把 `TinyImg.app` 拖进 Applications。
              应用为 ad-hoc 签名（未付费公证），首次启动若被 Gatekeeper 拦截，
              请右键 → 打开；或执行
              `xattr -dr com.apple.quarantine /Applications/TinyImg.app`。
            - Windows：需 Windows 10/11（自带 WebView2 运行时）。
              安装包未签名，SmartScreen 可能提示"未知发布者"，选择"仍要运行"即可。
