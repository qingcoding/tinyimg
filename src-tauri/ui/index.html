<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TinyImg</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="pg_brand" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0"/>
              <stop offset="1"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#pg_brand)"/>
          <path d="M24 11v13" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M17.5 19.5 24 26l6.5-6.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <rect x="13" y="33" width="22" height="4" rx="2" fill="#fff" opacity="0.92"/>
        </svg>
        <div class="brand-text">
          <h1 data-i18n="app.title">TinyImg</h1>
          <p data-i18n="app.tagline">本地压缩 · 视觉无损 · 零上传</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-hint" id="engineInfo" data-i18n="engine.ready">压缩引擎就绪</div>
        <!-- 主题菜单：衣服图标入口（原侧栏主题字段已移至此处） -->
        <div class="menu-wrap" id="themeMenuWrap">
          <button class="icon-btn" id="btnTheme" type="button" data-i18n-title="menu.theme" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          </button>
          <div class="menu-dropdown" id="themeMenu" role="menu" hidden>
            <div class="menu-title" data-i18n="menu.theme">主题颜色</div>
            <div class="menu-list" id="themeMenuList"></div>
          </div>
        </div>
        <!-- 顶部设置菜单：语言切换（原侧栏语言字段已移至此处） -->
        <div class="menu-wrap" id="settingsMenuWrap">
          <button class="icon-btn" id="btnSettings" type="button" data-i18n-title="menu.settings" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="menu-dropdown" id="settingsMenu" role="menu" hidden>
            <div class="menu-title" data-i18n="menu.settings">设置</div>
            <div class="menu-list" id="langMenuList"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 主体 -->
    <main class="layout">
      <section class="col-main">
        <!-- 导入区 -->
        <div class="dropzone" id="dropzone">
          <div class="dropzone-inner">
            <div class="dropzone-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.8" cy="8.8" r="1.9"/>
                <path d="m3 16 4.5-4.5 3.5 3.5 3-3L21 17"/>
              </svg>
            </div>
            <p class="dropzone-title" data-i18n="drop.title">拖入图片或文件夹到这里</p>
            <p class="dropzone-sub" data-i18n="drop.sub">也可以点击下方按钮选择 · 支持 PNG / JPEG · 全程本地处理</p>
            <div class="dropzone-actions">
              <button class="btn btn-primary" id="btnPickFiles" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3v5h5"/><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2z"/></svg>
                <span data-i18n="btn.pickFiles">选择单个文件</span>
              </button>
              <button class="btn btn-ghost" id="btnPickFolder" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span data-i18n="btn.pickFolder">选择整个文件夹</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 文件列表 -->
        <div class="panel list-panel" id="listPanel" hidden>
          <div class="panel-head">
            <h2 data-i18n="list.title">压缩队列</h2>
            <span class="muted" id="listCount"></span>
          </div>
          <div class="table-wrap">
            <table class="file-table">
              <thead>
                <tr>
                  <th class="col-name" data-i18n="th.name">文件</th>
                  <th class="col-size" data-i18n="th.original">原体积</th>
                  <th class="col-size" data-i18n="th.compressed">压缩后</th>
                  <th class="col-ratio" data-i18n="th.ratio">压缩率</th>
                  <th class="col-status" data-i18n="th.status">状态</th>
                  <th class="col-time" data-i18n="th.time">处理时间</th>
                  <th class="col-actions" data-i18n="th.actions">操作</th>
                </tr>
              </thead>
              <tbody id="fileTbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 右侧栏 -->
      <aside class="col-side">
        <!-- 统计 -->
        <div class="panel stats-panel">
          <div class="panel-head"><h2 data-i18n="stats.title">压缩统计</h2></div>
          <div class="stat-hero">
            <span class="stat-label" data-i18n="stats.saved">已节省</span>
            <strong class="stat-big" id="statSaved">0 B</strong>
          </div>
          <div class="stat-row">
            <div class="stat-item">
              <span class="stat-label" data-i18n="stats.avgRatio">平均压缩率</span>
              <strong class="stat-value good" id="statRatio">—</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label" data-i18n="stats.progress">完成进度</span>
              <strong class="stat-value" id="statDone">0 / 0</strong>
            </div>
          </div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>

        <!-- 输出设置 -->
        <div class="panel settings-panel">
          <div class="panel-head"><h2 data-i18n="settings.title">输出设置</h2></div>

          <div class="field">
            <label class="field-label" data-i18n="field.format">输出类型</label>
            <div class="segmented" id="formatSeg">
              <button class="seg active" data-format="auto" type="button"><span data-i18n="format.auto">跟随输入</span></button>
              <button class="seg" data-format="webp" type="button">WebP</button>
            </div>
            <p class="field-hint" data-i18n="field.formatHint">默认跟随输入：保持原格式压缩；选 WebP 体积更小，适合网页使用</p>
          </div>

          <div class="field">
            <label class="field-label" data-i18n="field.outputDir">输出文件夹</label>
            <div class="dir-row">
              <span class="dir-path" id="outputDirPath">未选择</span>
              <button class="btn btn-small btn-ghost" id="btnPickOutput" type="button"><span data-i18n="btn.pickOutput">选择目录</span></button>
            </div>
            <p class="field-hint" data-i18n="field.outputDirHint">未选择时输出到原文件所在目录（文件名加 -min，不覆盖原文件）</p>
          </div>

          <div class="field">
            <label class="field-label" for="levelSlider" data-i18n="field.level">压缩程度</label>
            <div class="level-row">
              <input type="range" id="levelSlider" min="0" max="100" step="1" value="100" />
              <span class="level-value" id="levelValue">100</span>
            </div>
            <div class="level-scale" aria-hidden="true">
              <span data-i18n="level.strong">激进</span>
              <span data-i18n="level.fine">细腻</span>
            </div>
            <p class="field-hint" data-i18n="field.levelHint">拖动控制细腻程度：越靠右画质越好、体积略大；越靠左压缩越狠、体积更小</p>
          </div>
        </div>

        <!-- 操作：主行动按钮（原底栏按钮移至侧栏底部） -->
        <div class="panel actions-panel">
          <button class="btn btn-primary btn-run" id="btnRun" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
            <span data-i18n="btn.run">开始压缩</span>
          </button>
          <button class="btn btn-ghost btn-clear" id="btnClear" type="button" disabled data-i18n="btn.clear">清空列表</button>
        </div>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
